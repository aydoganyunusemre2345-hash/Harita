<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Canlı Konum</title>
<style>
  :root{--bg:#0f172a;--card:#1e293b;--tx:#f1f5f9;--mut:#94a3b8;--ac:#38bdf8;--ok:#4ade80;--bad:#f87171}
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif;padding:16px;padding-top:calc(16px + env(safe-area-inset-top))}
  h1{font-size:20px;display:flex;justify-content:space-between;align-items:center}
  #durum{font-size:13px;color:var(--mut);display:flex;align-items:center;gap:6px}
  #durum i{width:10px;height:10px;border-radius:50%;background:var(--bad);display:inline-block}
  #durum.ok i{background:var(--ok)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
  .card{background:var(--card);border-radius:14px;padding:12px}
  .card.w{grid-column:span 2}
  .l{font-size:12px;color:var(--mut)}
  .v{font-size:20px;font-weight:600;margin-top:4px;word-break:break-all}
  canvas{width:100%;height:300px;background:var(--card);border-radius:14px;display:block}
  button{width:100%;margin-top:12px;padding:14px;border:0;border-radius:12px;background:var(--ac);color:#04121f;font-size:16px;font-weight:600}
  button.sec{background:var(--card);color:var(--tx)}
  #msg{margin-top:10px;font-size:13px;color:var(--bad);min-height:18px}
</style>
</head>
<body>
<h1>Canlı Konum <span id="durum"><i></i><span id="dt">Bekleniyor</span></span></h1>

<div class="grid">
  <div class="card w"><div class="l">Enlem / Boylam</div><div class="v" id="koor">--</div></div>
  <div class="card"><div class="l">Hız</div><div class="v" id="hiz">--</div></div>
  <div class="card"><div class="l">Yön</div><div class="v" id="yon">--</div></div>
  <div class="card"><div class="l">Yükseklik</div><div class="v" id="yuk">--</div></div>
  <div class="card"><div class="l">Doğruluk</div><div class="v" id="dog">--</div></div>
  <div class="card"><div class="l">Gidilen mesafe</div><div class="v" id="mes">0 m</div></div>
  <div class="card"><div class="l">Son güncelleme</div><div class="v" id="zam">--</div></div>
</div>

<canvas id="cv"></canvas>
<div id="msg"></div>
<button id="bas">Konumu Başlat</button>
<button class="sec" id="tem">İzi Temizle</button>

<script>
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
let pts = [], toplam = 0, watchId = null;

function haversine(a, b){
  const R = 6371000, r = x => x * Math.PI / 180;
  const dLat = r(b.lat - a.lat), dLon = r(b.lon - a.lon);
  const h = Math.sin(dLat/2)**2 + Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function yonAdi(d){
  return ['K','KD','D','GD','G','GB','B','KB'][Math.round(d/45) % 8];
}
function ciz(){
  const dpr = devicePixelRatio || 1;
  cv.width = cv.clientWidth * dpr; cv.height = cv.clientHeight * dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const W = cv.clientWidth, H = cv.clientHeight;
  ctx.clearRect(0,0,W,H);
  // ızgara
  ctx.strokeStyle = '#334155'; ctx.lineWidth = 1;
  for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  if(!pts.length){
    ctx.fillStyle='#94a3b8';ctx.font='14px system-ui';ctx.textAlign='center';
    ctx.fillText('Konum bekleniyor...',W/2,H/2);return;
  }
  const son = pts[pts.length-1];
  const mLat = 111320, mLon = 111320 * Math.cos(son.lat*Math.PI/180);
  const xy = pts.map(p => ({x:(p.lon-son.lon)*mLon, y:-(p.lat-son.lat)*mLat}));
  let max = 20;
  xy.forEach(p => max = Math.max(max, Math.abs(p.x), Math.abs(p.y)));
  const olcek = (Math.min(W,H)/2 - 24) / max;
  const P = p => [W/2 + p.x*olcek, H/2 + p.y*olcek];
  // iz
  ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 3; ctx.lineJoin = 'round';
  ctx.beginPath();
  xy.forEach((p,i)=>{const [x,y]=P(p); i?ctx.lineTo(x,y):ctx.moveTo(x,y);});
  ctx.stroke();
  // başlangıç
  const [sx,sy] = P(xy[0]);
  ctx.fillStyle='#4ade80';ctx.beginPath();ctx.arc(sx,sy,5,0,7);ctx.fill();
  // şu anki konum
  ctx.fillStyle='rgba(56,189,248,.25)';ctx.beginPath();ctx.arc(W/2,H/2,16,0,7);ctx.fill();
  ctx.fillStyle='#38bdf8';ctx.strokeStyle='#fff';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(W/2,H/2,7,0,7);ctx.fill();ctx.stroke();
  if(son.heading != null && !isNaN(son.heading)){
    ctx.save();ctx.translate(W/2,H/2);ctx.rotate(son.heading*Math.PI/180);
    ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(0,-26);ctx.lineTo(6,-14);ctx.lineTo(-6,-14);ctx.fill();ctx.restore();
  }
  ctx.fillStyle='#94a3b8';ctx.font='12px system-ui';ctx.textAlign='left';
  ctx.fillText('K ↑   ölçek: ' + Math.round(80/olcek) + ' m ≈ 80px', 10, H-10);
}
function guncelle(pos){
  const c = pos.coords;
  const p = {lat:c.latitude, lon:c.longitude, heading:c.heading};
  const onceki = pts[pts.length-1];
  if(!onceki || haversine(onceki,p) > Math.max(2, Math.min(c.accuracy||5, 10)/2)){
    if(onceki) toplam += haversine(onceki,p);
    pts.push(p);
  }
  $('koor').textContent = c.latitude.toFixed(6) + ', ' + c.longitude.toFixed(6);
  $('hiz').textContent = c.speed != null ? (c.speed*3.6).toFixed(1) + ' km/s' : '--';
  $('yon').textContent = (c.heading != null && !isNaN(c.heading)) ? Math.round(c.heading)+'° '+yonAdi(c.heading) : '--';
  $('yuk').textContent = c.altitude != null ? Math.round(c.altitude) + ' m' : '--';
  $('dog').textContent = '±' + Math.round(c.accuracy) + ' m';
  $('mes').textContent = toplam >= 1000 ? (toplam/1000).toFixed(2)+' km' : Math.round(toplam)+' m';
  $('zam').textContent = new Date(pos.timestamp).toLocaleTimeString('tr-TR');
  $('durum').className = 'ok'; $('dt').textContent = 'GPS aktif';
  $('msg').textContent = '';
  ciz();
}
function hata(e){
  $('durum').className=''; $('dt').textContent='Konum yok';
  const m = {1:'Konum izni reddedildi. Ayarlardan izin verin.',2:'Konum alınamadı. GPS açık mı?',3:'Konum zaman aşımına uğradı.'};
  $('msg').textContent = m[e.code] || e.message;
}
async function izinIste(){
  try{
    const G = window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.Geolocation;
    if(G){
      const r = await G.requestPermissions();
      if(r.location === 'denied') { hata({code:1}); return false; }
    }
  }catch(e){}
  return true;
}
async function baslat(){
  if(watchId !== null) return;
  if(!(await izinIste())) return;
  $('dt').textContent = 'Aranıyor...';
  watchId = navigator.geolocation.watchPosition(guncelle, hata,
    {enableHighAccuracy:true, maximumAge:0, timeout:20000});
  $('bas').textContent = 'Durdur';
}
function durdur(){
  navigator.geolocation.clearWatch(watchId); watchId = null;
  $('bas').textContent = 'Konumu Başlat';
  $('durum').className=''; $('dt').textContent='Durduruldu';
}
$('bas').onclick = () => watchId === null ? baslat() : durdur();
$('tem').onclick = () => { pts = pts.slice(-1); toplam = 0; $('mes').textContent='0 m'; ciz(); };
addEventListener('resize', ciz);
ciz();
baslat(); // açılışta izin ister ve takibi başlatır
</script>
</body>
</html>
